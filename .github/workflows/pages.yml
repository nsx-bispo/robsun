name: Deploy RobSun React to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run solar model tests
        run: npm run test:solar

      - name: Run V1 source smoke checks
        run: npm run test:smoke

      - name: Run V2 source smoke checks
        run: npm run test:smoke:v2

      - name: Build Vite app
        run: npm run build

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Run browser, mobile and desk UX regression tests
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/robsun-vite.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/robsun/ > /dev/null && curl -fsS http://127.0.0.1:4173/robsun/v2/ > /dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done

          if [ "$READY" -ne 1 ]; then
            echo "Vite preview did not become ready"
            cat /tmp/robsun-vite.log
            exit 1
          fi

          npm run test:e2e
          npm run test:e2e:v2
          npm run test:ux

      - name: Upload visual regression captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robsun-browser-captures
          path: |
            test-results
            test-results-v2
          if-no-files-found: ignore
          retention-days: 7

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
