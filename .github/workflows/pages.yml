name: Deploy RobSun React to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run source smoke checks
        run: npm run test:smoke

      - name: Build Vite app
        run: npm run build

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Run mobile and desktop browser regression tests
        run: npm run test:e2e

      - name: Upload visual regression captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robsun-browser-captures
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
