name: Deploy RobSun to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Materialize RobSun v4 site
        run: |
          python - <<'PY'
          import base64, gzip, json
          from pathlib import Path
          payload = json.loads(Path('site-v4.json').read_text())
          for path, encoded in payload.items():
              Path(path).write_bytes(gzip.decompress(base64.b64decode(encoded)))
              print(f'Materialized {path}')
          PY

      - name: Validate JavaScript syntax
        run: node --check v4.js

      - name: Run site smoke checks
        run: node tests/smoke.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
