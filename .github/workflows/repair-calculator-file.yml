name: Repair calculator source

on:
  push:
    paths:
      - '.github/workflows/repair-calculator-file.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore calculator source and keep mobile polish
        shell: bash
        run: |
          set -euo pipefail
          git show 1a0e998a2fa2f08b2ac5e50dc404207dd7be6287:src/app-v6.jsx > src/app-v6.jsx
          grep -q "calculator-mobile-polish.css" src/app-v6.jsx || sed -i "/import '.\/app-v6.css'/a import './calculator-mobile-polish.css'" src/app-v6.jsx
          git add src/app-v6.jsx src/calculator-mobile-polish.css
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair calculator source and retain mobile visual fix"
          git push

      - name: Remove repair workflow
        shell: bash
        run: |
          git rm .github/workflows/repair-calculator-file.yml
          git commit -m "Remove temporary calculator repair workflow"
          git push
