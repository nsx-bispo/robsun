name: Activate RobSun v7
on:
  push:
    paths: ['.github/workflows/activate-v7.yml']
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Finalize v7 and regression tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app-v7.jsx'); s=p.read_text(); s=s.replace('nf1.format(model.area-model.roofArea)', 'nf1.format(model.area-model.roofArea)' if False else 'nf1.format(model.area - model.roofArea)'); p.write_text(s)
          p=Path('index.html'); s=p.read_text().replace('/src/app-v6.jsx','/src/app-v7.jsx'); p.write_text(s)
          Path('tests/react-smoke.mjs').write_text('''import fs from "node:fs"\nconst source=fs.readFileSync("src/app-v7.jsx","utf8"),css=fs.readFileSync("src/app-v7.css","utf8"),index=fs.readFileSync("index.html","utf8"),pkg=JSON.parse(fs.readFileSync("package.json","utf8"));\nconst typewriter=source.split("function Typewriter()")[1]?.split("function Reveal")[0]||"";\nconst checks=[[index.includes("/src/app-v7.jsx"),"v7 entrypoint"],[source.includes("function Compass"),"simple compass component"],[source.includes("function RoofStage"),"roof stage component"],[source.includes("function SolarPanel"),"panel component"],[source.includes("LayoutGroup"),"layout animation"],[source.includes("personalized"),"neutral pre-input state"],[source.includes("≈"),"estimated values marked approximate"],[source.includes("Planejamos. Instalamos. Acompanhamos."),"commercial project message"],[source.includes("Nesta versão, a estimativa solar usa a referência média do estado."),"location limitation disclosed"],[source.includes("MotionConfig reducedMotion=\\"user\\""),"reduced motion policy"],[typewriter.length>0&&!typewriter.includes("useReducedMotion"),"iPhone typewriter independent of reduced motion"],[css.includes(".compass{"),"compass CSS"],[!css.includes("!important"),"no CSS important patches"],[!source.includes("calculator-mobile-polish.css"),"legacy patch CSS not imported"],[pkg.devDependencies.playwright,"Playwright configured"]];let failed=false;for(const [ok,label] of checks){console.log(`${ok?"✓":"✗"} ${label}`);if(!ok)failed=true}if(failed)process.exit(1);console.log("RobSun v7 smoke checks passed.")\n''')
          Path('tests/browser-checks.mjs').write_text('''import { chromium } from "playwright";import fs from "node:fs/promises";const baseUrl="http://127.0.0.1:4173/robsun/",dir="test-results";await fs.mkdir(dir,{recursive:true});function a(c,m){if(!c)throw new Error(m)}async function settle(p,n=420){await p.waitForTimeout(n)}async function overflow(p,l){const x=await p.evaluate(()=>({w:innerWidth,d:document.documentElement.scrollWidth,b:document.body.scrollWidth}));a(x.d<=x.w+1&&x.b<=x.w+1,`${l}: overflow ${JSON.stringify(x)}`)}async function targets(p,l){const bad=await p.locator("button:visible,a.btn:visible,input:visible,select:visible,summary:visible").evaluateAll(es=>es.map(e=>{const r=e.getBoundingClientRect();return{t:(e.textContent||e.getAttribute("aria-label")||"").trim().slice(0,30),h:r.height}}).filter(x=>x.h>0&&x.h<43));a(!bad.length,`${l}: small targets ${JSON.stringify(bad)}`)}async function run(browser,v,l,mobile,reduced="no-preference"){const c=await browser.newContext({viewport:v,reducedMotion:reduced});const p=await c.newPage();p.setDefaultTimeout(9000);const errs=[];p.on("console",m=>{if(m.type()==="error")errs.push(m.text())});p.on("pageerror",e=>errs.push(e.message));try{await p.goto(baseUrl,{waitUntil:"domcontentloaded"});await p.locator("#simulador").waitFor();await settle(p);await overflow(p,l);await targets(p,l);const t1=(await p.locator("#typewriter").textContent()||"").trim();await settle(p,520);const t2=(await p.locator("#typewriter").textContent()||"").trim();a(t1&&t2&&t1!==t2,`${l}: typewriter stalled`);await p.locator("#simulador").scrollIntoViewIfNeeded();await settle(p);if(mobile){a(await p.locator(".solar-scene.compact").isVisible(),`${l}: scene missing`);a(await p.locator(".solar-scene.compact").getAttribute("data-panels")==="0",`${l}: scene should start neutral`);a((await p.locator(".compact-metrics").textContent()).includes("—"),`${l}: metrics should start neutral`);await p.locator("#consumption").fill("1250");await settle(p);a(await p.locator("#consumption").inputValue()==="1.250",`${l}: pt-BR input failed`);a(Number(await p.locator(".solar-scene.compact").getAttribute("data-panels"))>0,`${l}: panels did not appear`);const scene=await p.locator(".solar-scene.compact").boundingBox(),roof=await p.locator(".solar-scene.compact .roof-position").boundingBox();a(scene&&roof&&roof.x>=scene.x&&roof.x+roof.width<=scene.x+scene.width,`${l}: roof clipped`);await p.getByRole("button",{name:/Continuar/}).click();await settle(p);a(await p.locator("#cityCep").isVisible(),`${l}: step2 missing`);await p.getByRole("button",{name:/Continuar/}).click();await settle(p);a(await p.locator(".compass").isVisible(),`${l}: compass should appear on solar step`);await p.getByRole("button",{name:"Sul",exact:true}).click();await settle(p);a(await p.locator(".solar-scene.compact").getAttribute("data-orientation")==="S",`${l}: orientation failed`);await p.getByRole("button",{name:/Continuar/}).click();await settle(p);a(await p.locator(".result-card").isVisible(),`${l}: final result missing`);a((await p.locator(".result-card").textContent()).includes("≈"),`${l}: approximate marker missing`);await p.locator(".advanced-details summary").click();a(await p.locator("#tilt").isVisible(),`${l}: advanced fields missing`)}else{a(await p.locator(".desktop-preview").isVisible(),`${l}: desktop preview missing`)}await overflow(p,`${l} final`);await p.locator("#simulador").screenshot({path:`${dir}/${l}-calculator.png`,animations:"disabled"});a(!errs.length,`${l}: browser errors ${errs.join(" | ")}`);console.log(`✓ ${l}`)}catch(e){await p.screenshot({path:`${dir}/${l}-failure.png`,fullPage:true,animations:"disabled"}).catch(()=>{});throw e}finally{await c.close()}}const b=await chromium.launch({headless:true});try{await run(b,{width:320,height:700},"mobile-320",true);await run(b,{width:393,height:852},"iphone-393",true);await run(b,{width:393,height:852},"iphone-393-reduced",true,"reduce");await run(b,{width:430,height:932},"mobile-430",true);await run(b,{width:1440,height:1000},"desktop-1440",false);console.log("✓ RobSun v7 E2E passed") }finally{await b.close()}\n''')
          old=Path('src/calculator-mobile-polish.css')
          if old.exists(): old.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Activate RobSun v7 experience and regression suite"
          git push
