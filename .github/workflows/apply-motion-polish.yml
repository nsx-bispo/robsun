name: Apply motion polish

on:
  push:
    paths:
      - '.github/workflows/apply-motion-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Polish compass and solar scene motion
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const appPath = 'src/app-v6.jsx'
          let app = fs.readFileSync(appPath, 'utf8')

          const oldCompass = `<div className="compass"><span>N</span><m.i animate={{ rotate:COMPASS_ANGLE[values.orientation] }} transition={{ type:'spring', stiffness:210, damping:22 }} /></div>`
          const newCompass = `<div className="compass" aria-label={\`Orientação do telhado: \${ORIENTATION_LABEL[values.orientation]}\`}>
            <div className="compass-ring" aria-hidden="true"><span className="compass-n">N</span><span className="compass-e">E</span><span className="compass-s">S</span><span className="compass-o">O</span><m.div className="compass-ticks" animate={{ rotate:COMPASS_ANGLE[values.orientation] * .18 }} transition={{ type:'spring', stiffness:170, damping:22 }} /></div>
            <m.div className="compass-needle" animate={{ rotate:COMPASS_ANGLE[values.orientation] }} transition={{ type:'spring', stiffness:230, damping:24, mass:.65 }} aria-hidden="true"><i className="needle-north" /><i className="needle-south" /></m.div>
            <div className="compass-center" aria-hidden="true"><span /></div>
            <m.span className="compass-heading" key={values.orientation} initial={{ opacity:0, y:3 }} animate={{ opacity:1, y:0 }} transition={{ duration:.22 }}>{ORIENTATION_LABEL[values.orientation]}</m.span>
          </div>`
          if (!app.includes(oldCompass)) throw new Error('Compass markup not found')
          app = app.replace(oldCompass, newCompass)

          const oldGlint = '<span className="panel-glint" />'
          const newGlint = `<m.span className="panel-glint" animate={reduced ? undefined : { x:['-28%','28%','-28%'] }} transition={reduced ? undefined : { duration:3.8, repeat:Infinity, ease:'easeInOut', delay:Math.min(index*.09,.7) }} />`
          if (!app.includes(oldGlint)) throw new Error('Panel glint not found')
          app = app.replaceAll(oldGlint, newGlint)

          const oldRoof = '<div className="roof-positioner" style={{ \'--roof-rotation\':`${ROOF_ROTATION[values.orientation]}deg` }}>'
          const newRoof = '<m.div className="roof-positioner" animate={{ y:[0,-2,0] }} transition={reduced ? undefined : { duration:5.2, repeat:Infinity, ease:\'easeInOut\' }} style={{ \'--roof-rotation\':`${ROOF_ROTATION[values.orientation]}deg` }}>'
          if (!app.includes(oldRoof)) throw new Error('Roof positioner not found')
          app = app.replace(oldRoof, newRoof)
          app = app.replace('</div>\n    <m.div className="scene-shade"', '</m.div>\n    <m.div className="scene-shade"')

          fs.writeFileSync(appPath, app)

          const cssPath = 'src/app-v6.css'
          let css = fs.readFileSync(cssPath, 'utf8')
          css += `\n/* Premium solar-scene motion layer */
          .compass{width:62px;height:62px;left:14px;top:14px;border-radius:50%;background:rgba(255,255,255,.82);border:1px solid rgba(15,108,57,.13);box-shadow:0 12px 28px rgba(16,36,27,.10),inset 0 0 0 5px rgba(255,255,255,.48);backdrop-filter:blur(12px);overflow:visible}
          .solar-scene-compact .compass{width:54px;height:54px;left:11px;top:11px}
          .compass-ring{position:absolute;inset:6px;border:1px solid rgba(15,108,57,.12);border-radius:50%;font-size:7px;font-weight:900;color:#718077;letter-spacing:.04em}
          .compass-ring:before,.compass-ring:after{content:"";position:absolute;left:50%;top:50%;background:rgba(15,108,57,.09);transform:translate(-50%,-50%)}
          .compass-ring:before{width:1px;height:calc(100% - 8px)}.compass-ring:after{width:calc(100% - 8px);height:1px}
          .compass-ring span{position:absolute!important;inset:auto!important;line-height:1;transform:none!important;font-size:7px!important;color:#65746b!important}
          .compass-n{top:2px!important;left:50%;transform:translateX(-50%)!important;color:var(--green)!important}.compass-e{right:2px!important;top:50%!important;transform:translateY(-50%)!important}.compass-s{bottom:2px!important;left:50%;transform:translateX(-50%)!important}.compass-o{left:2px!important;top:50%!important;transform:translateY(-50%)!important}
          .compass-ticks{position:absolute;inset:2px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(15,108,57,.16) 0deg 1deg,transparent 1deg 15deg);mask:radial-gradient(circle,transparent 0 43%,#000 45% 48%,transparent 50%)}
          .compass-needle{position:absolute;left:50%;top:50%;width:6px;height:35px;transform-origin:50% 50%;margin-left:-3px;margin-top:-17.5px;z-index:3;filter:drop-shadow(0 3px 4px rgba(16,36,27,.18))}
          .needle-north,.needle-south{position:absolute;left:50%;width:0;height:0;transform:translateX(-50%);border-left:4px solid transparent;border-right:4px solid transparent}
          .needle-north{top:0;border-bottom:15px solid var(--green)}.needle-south{bottom:0;border-top:15px solid #9ca9a0}
          .compass-center{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;transform:translate(-50%,-50%);background:#fff;border:2px solid var(--green);z-index:4;box-shadow:0 2px 7px rgba(16,36,27,.16)}
          .compass-center span{display:block;width:3px;height:3px;border-radius:50%;background:var(--yellow);margin:1px auto}
          .compass-heading{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);white-space:nowrap;padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.88);border:1px solid rgba(15,108,57,.10);box-shadow:0 5px 12px rgba(16,36,27,.07);font-size:7px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--green);z-index:7}
          .roof-positioner{transition:transform .72s cubic-bezier(.16,1,.3,1);will-change:transform}
          .roof-scaler{will-change:transform}
          .panel-glint{will-change:transform}
          .scene-rays{animation:solar-rays 7s ease-in-out infinite}
          @keyframes solar-rays{0%,100%{opacity:.55;transform:translateX(-2%)}50%{opacity:.9;transform:translateX(2%)}}
          @media (prefers-reduced-motion:reduce){.scene-rays{animation:none}.roof-positioner{transition:none}.panel-glint{animation:none}}
          `
          fs.writeFileSync(cssPath, css)

          const smokePath = 'tests/react-smoke.mjs'
          let smoke = fs.readFileSync(smokePath, 'utf8')
          if (!smoke.includes('Premium compass markup exists')) {
            const marker = "[source.includes('function Typewriter'), 'Typewriter component exists'],"
            if (!smoke.includes(marker)) throw new Error('Smoke marker not found')
            smoke = smoke.replace(marker, marker + "\n  [source.includes('compass-ring') && source.includes('compass-needle'), 'Premium compass markup exists'],\n  [source.includes('panel-glint') && source.includes('ease:\\'easeInOut\\''), 'Panel glint motion exists'],")
            fs.writeFileSync(smokePath, smoke)
          }
          NODE

      - name: Commit polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app-v6.jsx src/app-v6.css tests/react-smoke.mjs
          git diff --cached --check
          git commit -m "Polish solar calculator compass and scene motion"
          git push
